name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node ${{ matrix.node }} — unit, CLI and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.17'
          python-version: '3.12'
          enable-cache: true

      - name: Install
        run: npm ci

      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/unit.log"
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then
            # Surface the failing test names as annotations: the run page shows these without a
            # login, which is how a public run is debugged without downloading the job log.
            grep -E '^[[:space:]]*not ok [0-9]+ - ' "$RUNNER_TEMP/unit.log" | head -10 | while IFS= read -r line; do
              line="${line//$'\n'/ }"
              echo "::error title=Unit test failure::${line}"
            done
          fi
          exit "$code"

      - name: Release gate (manifest, changelog, packed file list)
        if: matrix.node == '22.19.0'
        run: npm run release:check

      - name: Build the publishable tarball
        if: matrix.node == '22.19.0'
        run: npm run release:pack

      - name: CLI smoke test
        run: |
          node bin/browser-use-mcp.mjs --version
          node bin/browser-use-mcp.mjs --help > /dev/null

  e2e:
    name: Real-browser end-to-end (Chrome + Python 3.12)
    # Real Chrome and real processes make these suites timing-sensitive, and they are the slowest
    # part of CI. A pull request gets the unit matrix and the release gate; the end-to-end job runs on
    # main pushes and for a release (a reusable workflow sees the caller's event: the tag push, or a
    # manual dispatch naming the tag), where the real browser has to be proven.
    if: github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # One retry per suite: a failed attempt is annotated and retried, and a suite that fails both
      # times still annotates its failure. Unit tests are never retried.
      E2E_ATTEMPTS: '2'
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.17'
          python-version: '3.12'
          enable-cache: true

      - name: Install
        run: npm ci

      - name: Locate Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo "::error::no Chrome or Chromium on this runner, and the end-to-end suites need one"
            exit 1
          fi
          echo "BROWSER_USE_MCP_TEST_CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      # The suites provision their managed engine environment on first use; the state root lives in
      # the runner's temp directory, so nothing outside the job is touched. Each suite is its own step
      # so a red run names the suite; the script retries a timing failure once (E2E_ATTEMPTS) and turns
      # the failure that remains into annotations.
      - name: End-to-end stdio
        env:
          BROWSER_USE_MCP_TEST_HOME: ${{ runner.temp }}/browser-use-mcp-e2e
        run: bash .github/scripts/e2e-suite.sh stdio

      - name: End-to-end HTTP
        env:
          BROWSER_USE_MCP_TEST_HOME: ${{ runner.temp }}/browser-use-mcp-e2e
        run: bash .github/scripts/e2e-suite.sh http

      - name: End-to-end attach
        env:
          BROWSER_USE_MCP_TEST_HOME: ${{ runner.temp }}/browser-use-mcp-e2e
        run: bash .github/scripts/e2e-suite.sh attach

      - name: End-to-end daemon isolation
        env:
          BROWSER_USE_MCP_TEST_HOME: ${{ runner.temp }}/browser-use-mcp-e2e
        run: bash .github/scripts/e2e-suite.sh daemon-isolation

      - name: End-to-end Jev intent
        env:
          BROWSER_USE_MCP_TEST_HOME: ${{ runner.temp }}/browser-use-mcp-e2e
        run: bash .github/scripts/e2e-suite.sh intent

      - name: End-to-end protocol
        env:
          BROWSER_USE_MCP_TEST_HOME: ${{ runner.temp }}/browser-use-mcp-e2e
        run: bash .github/scripts/e2e-suite.sh protocol

      - name: Leave no browser or daemon behind
        if: always()
        run: |
          pkill -f browser_harness.daemon || true
          pkill -f 'browser-use-mcp.mjs' || true
