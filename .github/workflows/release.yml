name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated vX.Y.Z tag to release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out with tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch every tag object
        shell: bash
        run: git fetch --tags --force origin '+refs/tags/*:refs/tags/*'

      - name: Require an annotated tag on main that matches package.json
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$DISPATCH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::a release tag must look like vX.Y.Z, not '$tag'"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag '$tag' does not exist"
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            echo "::error::tag '$tag' must be annotated (git tag -a), so the release has an owner and a date"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" origin/main; then
            echo "::error::tag '$tag' is not on main; release from main only"
            exit 1
          fi
          version="$(jq -r .version package.json)"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::tag '$tag' does not match package.json version '$version'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version from $tag"

  check:
    name: Run the full CI gate
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ needs.validate.outputs.version }} to npm
    needs: [validate, check]
    if: github.repository == 'ricardochen1996/browser-use-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ricardochen1996/browser-use-mcp
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Ensure npm supports Trusted Publishing
        run: npm install --global npm@11

      - name: Stop if this version is already published
        id: existing
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm; the release will not publish again."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm provenance
        if: steps.existing.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          # Two supported credentials: a repository secret (an automation token, or a granular token
          # with publish access) or npm Trusted Publishing, where npm exchanges this job's OIDC token
          # for a short-lived publish credential after the package's settings name this repository and
          # workflow. With neither, npm cannot authenticate and the error below says both options.
          npm run release:check -- --tag "${{ needs.validate.outputs.tag }}"
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            # An empty NODE_AUTH_TOKEN is not a credential; remove it so npm upgrades to OIDC
            # trusted publishing instead of sending an empty auth header.
            unset NODE_AUTH_TOKEN
            echo "::notice::No NPM_TOKEN secret; publishing through npm Trusted Publishing (OIDC)."
          fi
          set +e
          npm publish --access public --provenance 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then
            tail -8 "$RUNNER_TEMP/npm-publish.log" | while IFS= read -r line; do
              line="${line//$'\n'/ }"
              echo "::error title=npm publish::${line}"
            done
            echo "::error::npm publish failed. Configure either (a) an NPM_TOKEN repository secret with publish access, or (b) a Trusted Publisher on npmjs.com for this package pointing at ricardochen1996/browser-use-mcp and .github/workflows/release.yml, then re-run this workflow."
            exit "$code"
          fi

      - name: Create the GitHub Release
        if: github.repository == 'ricardochen1996/browser-use-mcp'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::the GitHub Release for $TAG already exists; leaving it in place."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Build the publishable tarball
        run: npm run release:pack

      - name: Attach the tarball to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: gh release upload "$TAG" dist/*.tgz dist/pack.json --clobber
